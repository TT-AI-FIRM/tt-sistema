<!doctype html>
<html lang="es-MX">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a10">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="T.T">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<title>T.T AI Firm · Sistema interno</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div class="bg" aria-hidden="true"><i class="ring r1"></i><i class="ring r2"></i><i class="glow g1"></i><i class="glow g2"></i></div>

<div class="frame">
  <header class="top">
    <nav class="pill nav" id="nav" aria-label="Secciones">
      <button class="nav-item is-active" data-view="inicio"><span class="ic" data-icon="home"></span>Inicio</button>
      <button class="nav-item" data-view="avisos"><span class="ic" data-icon="bell"></span>Notificaciones<span class="cuenta" hidden></span></button>
      <button class="nav-item" data-view="clientes"><span class="ic" data-icon="users"></span>Clientes</button>
      <button class="nav-item" data-view="demos"><span class="ic" data-icon="spark"></span>Demos</button>
      <button class="nav-item" data-view="pendientes"><span class="ic" data-icon="check"></span>Pendientes</button>
      <button class="nav-item solo-escritorio" data-view="proyectos"><span class="ic" data-icon="folder"></span>Proyectos</button>
      <button class="nav-item solo-escritorio" data-view="cobranza"><span class="ic" data-icon="wallet"></span>Cobranza</button>
      <button class="nav-item solo-escritorio" data-view="equipo"><span class="ic" data-icon="team"></span>Equipo</button>
      <button class="nav-item solo-movil" data-view="mas"><span class="ic" data-icon="more"></span>Más</button>
    </nav>
    <button class="icon-btn" id="btnBuscar" title="Buscar (⌘K)" aria-label="Buscar"><span class="ic" data-icon="search"></span></button>
    <div class="spacer"></div>
    <button class="pill who" id="btnQuien" title="Cambiar de socio">
      <span class="avatar" id="whoAvatar">CM</span>
      <span class="who-name" id="whoName">Carlos</span>
      <span class="tag" id="whoTag">Socio</span>
    </button>
    <button class="icon-btn" id="btnAlertas" title="Pendientes vencidos" aria-label="Pendientes"><span class="ic" data-icon="bell"></span><i class="dot" id="alertDot" hidden></i></button>
    <button class="pill ghost" id="btnSalir"><span class="ic" data-icon="out"></span>Salir</button>
  </header>

  <main id="view" class="view" data-current="inicio"></main>
</div>

<!-- panel lateral (ficha / detalle) -->
<div class="overlay" id="overlay" hidden></div>
<aside class="panel" id="panel" aria-hidden="true">
  <div class="panel-head">
    <div>
      <div class="eyebrow" id="panelEyebrow"></div>
      <h2 id="panelTitle"></h2>
    </div>
    <button class="icon-btn" id="panelClose" aria-label="Cerrar"><span class="ic" data-icon="x"></span></button>
  </div>
  <div class="panel-body" id="panelBody"></div>
</aside>

<!-- buscador -->
<div class="overlay" id="overlaySearch" hidden></div>
<div class="search" id="search" hidden>
  <div class="search-box">
    <span class="ic" data-icon="search"></span>
    <input id="searchInput" type="search" placeholder="Buscar cliente, proyecto, tarea…" autocomplete="off">
    <kbd>esc</kbd>
  </div>
  <div class="search-results" id="searchResults"></div>
</div>

<!-- selector de socio -->
<div class="overlay" id="overlayQuien" hidden></div>
<div class="modal" id="modalQuien" hidden>
  <div class="eyebrow">¿Quién está usando el sistema?</div>
  <h2>Elige tu perfil</h2>
  <div class="quien-list" id="quienList"></div>
  <p class="muted small">Sin contraseña por ahora. Cuando se conecte la base de datos de T.T, cada socio entra con su propio acceso.</p>
</div>

<!-- acceso (solo cuando el sistema está conectado a la nube de T.T) -->
<div class="overlay" id="overlayLogin" hidden></div>
<div class="modal login" id="modalLogin" hidden role="dialog" aria-modal="true" aria-labelledby="loginTitulo">
  <div class="eyebrow">T.T AI Firm</div>
  <div id="loginPaso1">
    <h2 id="loginTitulo">¿Quién eres?</h2>
    <div class="socios-grid" id="loginSocios"></div>
  </div>
  <div id="loginPaso2" hidden>
    <div class="login-head"><span class="avatar" id="loginAvatar"></span><div><h2 id="loginNombre">Hola</h2><p class="muted small">Escribe tu PIN de 4 dígitos</p></div></div>
    <div class="pin-dots" id="pinDots" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
    <div class="keypad" id="keypad">
      <button class="key" data-k="1">1</button><button class="key" data-k="2">2</button><button class="key" data-k="3">3</button>
      <button class="key" data-k="4">4</button><button class="key" data-k="5">5</button><button class="key" data-k="6">6</button>
      <button class="key" data-k="7">7</button><button class="key" data-k="8">8</button><button class="key" data-k="9">9</button>
      <button class="key ghost" data-k="cambiar">Cambiar</button><button class="key" data-k="0">0</button><button class="key ghost" data-k="borrar" aria-label="Borrar">⌫</button>
    </div>
  </div>
  <p class="muted small" id="loginMsg" style="margin:12px 0 0;min-height:18px" aria-live="polite"></p>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="config.js"></script>
<script src="semilla.js"></script>
<script src="data.js"></script>
<script src="app.js"></script>
</body>
</html>
